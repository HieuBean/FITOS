server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/fitos
    username: ${DB_USER:fitos_user}
    password: ${DB_PASSWORD:supersecret}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:superjwtsecret_default_key_for_dev_mode}
  expirationMs: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

fitos:
  cors:
    allowed-origins: ${FITOS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  bootstrap:
    admin-password: ${FITOS_BOOTSTRAP_ADMIN_PASSWORD:}
  ai:
    crm-url: ${AI_SERVICE_URL:http://localhost:8000}
    operations-url: ${AI_OPERATIONS_URL:http://localhost:8003}
    workout-url: ${AI_WORKOUT_URL:http://localhost:8004}
    token: ${AI_SERVICE_TOKEN:fitos-ai-token}
