services:
  postgres:
    image: postgres:16-alpine
    container_name: fitos-postgres
    restart: always
    environment:
      POSTGRES_DB: fitos
      POSTGRES_USER: fitos_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitos_user -d fitos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fitos-redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitos-backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fitos
      DB_USER: fitos_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-fitos_local_development_jwt_secret_32bytes}
      FITOS_BOOTSTRAP_ADMIN_PASSWORD: ${FITOS_BOOTSTRAP_ADMIN_PASSWORD:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-fitos-ai-token}
      AI_SERVICE_URL: http://ai:8000
      AI_WORKOUT_URL: http://ai-workout:8004
      FITOS_CORS_ALLOWED_ORIGINS: ${FITOS_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

  # Person D (Layer 4 & Layer 5) - AI Workout Coach Microservice
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-fitos-ai-token}
    expose:
      - "8000"

  ai-workout:
    build:
      context: ./ai-workout
      dockerfile: Dockerfile
    container_name: fitos-ai-workout
    restart: always
    environment:
      PORT: 8004
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-fitos-ai-token}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    expose:
      - "8004"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080/api}
    container_name: fitos-frontend
    restart: always
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - backend
      - ai-workout

volumes:
  pgdata:
