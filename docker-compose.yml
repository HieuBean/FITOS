services:
  postgres:
    image: postgres:16-alpine
    container_name: fitos-postgres
    restart: always
    environment:
      POSTGRES_DB: fitos
      POSTGRES_USER: fitos_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitos_user -d fitos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fitos]

  redis:
    image: redis:7-alpine
    container_name: fitos-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fitos]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitos-backend
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fitos
      DB_USER: fitos_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-fitos_local_development_jwt_secret_32bytes}
      FITOS_BOOTSTRAP_ADMIN_PASSWORD: ${FITOS_BOOTSTRAP_ADMIN_PASSWORD:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-fitos-ai-token}
      AI_SERVICE_URL: http://ai-crm:8001
      AI_COMMERCE_URL: http://ai-commerce:8002
      AI_OPERATIONS_URL: http://ai-operations:8003
      AI_WORKOUT_URL: http://ai-workout:8004
      FITOS_CORS_ALLOWED_ORIGINS: ${FITOS_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/studios || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fitos]

  # Person A — CRM AI (lead scoring & follow-up)
  ai-crm:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: fitos-ai-crm
    restart: always
    environment:
      PORT: 8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-fitos-ai-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    expose:
      - "8001"
    networks: [fitos]

  # Person B — Commerce AI (renewal & upsell)
  ai-commerce:
    build:
      context: ./ai-commerce
      dockerfile: Dockerfile
    container_name: fitos-ai-commerce
    restart: always
    environment:
      PORT: 8002
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-fitos-ai-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    expose:
      - "8002"
    networks: [fitos]

  # Person C — Operations AI (no-show, schedule, trainer tips)
  ai-operations:
    build:
      context: ./ai-operations
      dockerfile: Dockerfile
    container_name: fitos-ai-operations
    restart: always
    environment:
      PORT: 8003
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-fitos-ai-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "${AI_OPERATIONS_HOST_PORT:-8003}:8003"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [fitos]

  # Person D — Workout AI (chat coach & programme recommendations)
  ai-workout:
    build:
      context: ./ai-workout
      dockerfile: Dockerfile
    container_name: fitos-ai-workout
    restart: always
    environment:
      PORT: 8004
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-fitos-ai-token}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    expose:
      - "8004"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8004/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [fitos]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080/api}
    container_name: fitos-frontend
    restart: always
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    networks: [fitos]

volumes:
  pgdata:
  redisdata:

networks:
  fitos:
    driver: bridge
