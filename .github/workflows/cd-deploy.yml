name: CD - Build, Push to GHCR & Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify backend, AI and frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fitos_test
          POSTGRES_USER: fitos_user
          POSTGRES_PASSWORD: supersecret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitos_user -d fitos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test backend with PostgreSQL
        working-directory: backend
        env:
          FITOS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/fitos_test
          FITOS_TEST_DATABASE_USER: fitos_user
          FITOS_TEST_DATABASE_PASSWORD: supersecret
          FITOS_TEST_REDIS: 'true'
        run: mvn -B test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-workout/requirements.txt
      - name: Test AI Workout
        working-directory: ai-workout
        env:
          GEMINI_API_KEY: ''
          OPENAI_API_KEY: ''
        run: |
          python -m pip install -r requirements.txt pytest pytest-mock
          python -m pytest tests -q -p no:cacheprovider
      - name: Test CRM scoring service
        working-directory: ai-crm
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tests -q -p no:cacheprovider
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit --incremental false
          npx playwright install --with-deps chromium
          npx playwright test tests/layer3_person_a.spec.ts --reporter=line --workers=1

  build-and-push:
    name: Build & Push Container (${{ matrix.service.name }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend
            context: ./backend
            image: fitos-backend
          - name: ai-workout
            context: ./ai-workout
            image: fitos-ai-workout
          - name: ai-crm
            context: ./ai-crm
            image: fitos-ai-crm
          - name: frontend
            context: ./frontend
            image: fitos-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Require frontend API URL
        if: matrix.service.name == 'frontend'
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_BACKEND_URL" ]; then
            echo "::error::Set the NEXT_PUBLIC_BACKEND_URL repository variable before deploying frontend"
            exit 1
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-railway:
    name: Trigger Railway Deployment
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Railway Deploy via Webhook
        env:
          BACKEND_WEBHOOK: ${{ secrets.RAILWAY_BACKEND_DEPLOY_WEBHOOK }}
          AI_WORKOUT_WEBHOOK: ${{ secrets.RAILWAY_AI_WORKOUT_DEPLOY_WEBHOOK }}
          AI_CRM_WEBHOOK: ${{ secrets.RAILWAY_AI_CRM_DEPLOY_WEBHOOK }}
          FRONTEND_WEBHOOK: ${{ secrets.RAILWAY_FRONTEND_DEPLOY_WEBHOOK }}
        run: |
          for name in BACKEND_WEBHOOK AI_WORKOUT_WEBHOOK AI_CRM_WEBHOOK FRONTEND_WEBHOOK; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for deployment"
              exit 1
            fi
          done
          curl --fail-with-body --show-error --silent --retry 3 -X POST "$BACKEND_WEBHOOK"
          curl --fail-with-body --show-error --silent --retry 3 -X POST "$AI_WORKOUT_WEBHOOK"
          curl --fail-with-body --show-error --silent --retry 3 -X POST "$AI_CRM_WEBHOOK"
          curl --fail-with-body --show-error --silent --retry 3 -X POST "$FRONTEND_WEBHOOK"

      - name: Smoke test deployed services
        env:
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
          AI_WORKOUT_HEALTH_URL: ${{ vars.AI_WORKOUT_HEALTH_URL }}
          FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
        run: |
          for name in BACKEND_HEALTH_URL AI_WORKOUT_HEALTH_URL FRONTEND_HEALTH_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for deployed smoke tests"
              exit 1
            fi
            healthy=0
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error --max-time 5 "${!name}" > /dev/null; then
                healthy=1
                break
              fi
              sleep 10
            done
            if [ "$healthy" -ne 1 ]; then
              echo "::error::$name did not become healthy"
              exit 1
            fi
          done

      - name: Log Deployment Information
        run: |
          echo "================================================================="
          echo "Deployment pipeline executed for commit: ${{ github.sha }}"
          echo "Images published to GHCR:"
          echo "  - ghcr.io/${{ github.repository_owner }}/fitos-backend:latest"
          echo "  - ghcr.io/${{ github.repository_owner }}/fitos-ai-workout:latest"
          echo "  - ghcr.io/${{ github.repository_owner }}/fitos-ai-crm:latest"
          echo "  - ghcr.io/${{ github.repository_owner }}/fitos-frontend:latest"
          echo "================================================================="
