name: CI AI Commerce

on:
  push:
    paths:
      - 'ai-commerce/**'
      - '.github/workflows/ci-ai-commerce.yml'
  pull_request:
    paths:
      - 'ai-commerce/**'
      - '.github/workflows/ci-ai-commerce.yml'

jobs:
  test:
    name: Run Pytest for AI Commerce
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-commerce

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-commerce/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v
