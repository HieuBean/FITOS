name: CI - AI Operations Microservice

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'ai-operations/**'
      - '.github/workflows/ci-ai-operations.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'ai-operations/**'
      - '.github/workflows/ci-ai-operations.yml'

jobs:
  test:
    name: Pytest + Docker build (port 8003)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-operations

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'ai-operations/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Run Pytest Test Suite
        env:
          AI_SERVICE_TOKEN: fitos-ai-token
          PORT: '8003'
          OPENAI_API_KEY: ""
        run: |
          python -m pytest -q --junitxml=results.xml

      - name: Verify Dockerfile builds
        working-directory: .
        run: docker build -t fitos-ai-operations:ci ./ai-operations

      - name: Smoke test container health
        working-directory: .
        run: |
          docker run -d --rm --name ai-ops-ci -p 8003:8003 \
            -e AI_SERVICE_TOKEN=fitos-ai-token fitos-ai-operations:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8003/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8003/health | grep -q '"service":"ai-operations"'
          docker stop ai-ops-ci

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-ai-operations
          path: ai-operations/results.xml
          retention-days: 7
